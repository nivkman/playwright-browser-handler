name: Tests

# Runs the node:test suite against a real headless Chromium on every push and PR.
# Kept separate from ci.yml so the standard publish pipeline stays untouched.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test
